<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/atomic-finds-atx-design-system-29110ac3-0a76-4fa1-a322-a78bc212a50d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/atomic-finds-atx-design-system-29110ac3-0a76-4fa1-a322-a78bc212a50d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/atomic-finds-atx-design-system-29110ac3-0a76-4fa1-a322-a78bc212a50d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/atomic-finds-atx-design-system-29110ac3-0a76-4fa1-a322-a78bc212a50d/styles.css">
  <script src="_ds/atomic-finds-atx-design-system-29110ac3-0a76-4fa1-a322-a78bc212a50d/_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #1E1E1E; overflow: hidden; }
  </style>
</helmet>
<div style="position:relative; width:100vw; height:100vh; background:#1E1E1E; overflow:hidden;">
  <canvas ref="{{ canvasRef }}" style="position:absolute; inset:0; width:100%; height:100%; display:block;"></canvas>
  <div style="position:absolute; bottom:32px; left:50%; transform:translateX(-50%); display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:90vw; padding:14px 20px; background:rgba(30,30,30,0.55); border:1px solid rgba(245,200,66,0.15); border-radius:18px; backdrop-filter:blur(6px); z-index:5;">
    <sc-for list="{{ shapeButtons }}" as="btn" hint-placeholder-count="5">
      <x-import component-from-global-scope="AtomicFindsDesignSystem_29110a.Button" variant="{{ btn.variant }}" size="sm" onClick="{{ btn.onClick }}" hint-size="150px,40px">{{ btn.label }}</x-import>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;particleDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:300,&quot;min&quot;:80,&quot;max&quot;:400,&quot;step&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;animationSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:10,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;autoCycle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;mouseInteraction&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.canvasRef = React.createRef();
    this.state = { activeIdx: 0 };
    this.phase = 'drift';
    this.phaseStart = 0;
    this.lastTime = 0;
    this.dims = { w: 0, h: 0 };
    this.mouse = { x: -9999, y: -9999, active: false };
    this.formableCount = 0;
    this.particles = [];

    this.shapes = [
      { name: 'Peacock Chair', img: 'assets/reveal-peacock-chair.png' },
      { name: 'Rattan Armchair', img: 'assets/reveal-rattan-armchair.png' },
      { name: 'Bamboo Armchair', img: 'assets/reveal-bamboo-armchair.png' },
      { name: 'Arched \u00c9tag\u00e8re', img: 'assets/reveal-arched-etagere.png' },
      { name: 'Floor Lamp', img: 'assets/reveal-floor-lamp.png' }
    ];
    this.shapes.forEach(s => { const im = new Image(); im.src = s.img; s.el = im; });

    this.tick = this.tick.bind(this);
    this.onResize = this.onResize.bind(this);
    this.onMouseMove = this.onMouseMove.bind(this);
    this.onMouseLeave = this.onMouseLeave.bind(this);
  }

  componentDidMount() {
    const canvas = this.canvasRef.current;
    this.ctx = canvas.getContext('2d');
    this.onResize();
    this.initParticles();
    window.addEventListener('resize', this.onResize);
    canvas.addEventListener('mousemove', this.onMouseMove);
    canvas.addEventListener('mouseleave', this.onMouseLeave);
    this.phaseStart = performance.now();
    this.rafId = requestAnimationFrame(this.tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.rafId);
    window.removeEventListener('resize', this.onResize);
    const canvas = this.canvasRef.current;
    if (canvas) {
      canvas.removeEventListener('mousemove', this.onMouseMove);
      canvas.removeEventListener('mouseleave', this.onMouseLeave);
    }
  }

  onResize() {
    const canvas = this.canvasRef.current;
    if (!canvas) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    const oldW = this.dims.w || rect.width;
    const oldH = this.dims.h || rect.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sx = rect.width / oldW, sy = rect.height / oldH;
    if (this.particles && this.particles.length && isFinite(sx) && isFinite(sy)) {
      this.particles.forEach(p => {
        p.x *= sx; p.y *= sy;
        if (p.tx != null) { p.tx *= sx; p.ty *= sy; }
        if (p.formX != null) { p.formX *= sx; p.formY *= sy; }
      });
    }
    this.dims = { w: rect.width, h: rect.height };
  }

  onMouseMove(e) {
    const rect = this.canvasRef.current.getBoundingClientRect();
    this.mouse.x = e.clientX - rect.left;
    this.mouse.y = e.clientY - rect.top;
    this.mouse.active = true;
  }
  onMouseLeave() { this.mouse.active = false; }

  initParticles() {
    const w = this.dims.w, h = this.dims.h;
    const count = this.props.particleDensity ?? 300;
    this.formableCount = Math.min(Math.round(count * 0.55), 200);
    const particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
        r: Math.random() * 1.4 + 1,
        isFormable: i < this.formableCount,
        tx: null, ty: null, formX: null, formY: null,
        breakBefore: false,
        phaseOffset: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.4 + Math.random() * 0.8,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }
    this.particles = particles;
  }

  getStageCircle() {
    const w = this.dims.w, h = this.dims.h;
    const r = Math.min(w, h) * 0.24;
    return { cx: w/2, cy: h/2 - h*0.02, r };
  }

  assignShapeTargets(idx) {
    const { cx, cy, r } = this.getStageCircle();
    const ringR = r * 1.18;
    const n = this.formableCount;
    for (let i = 0; i < n; i++) {
      const p = this.particles[i];
      const ang = (i / n) * Math.PI * 2 - Math.PI/2;
      p.formX = p.x; p.formY = p.y;
      p.tx = cx + Math.cos(ang) * ringR;
      p.ty = cy + Math.sin(ang) * ringR;
      p.breakBefore = i === 0;
    }
  }

  startForming(idx) {
    this.currentShapeIdx = idx;
    this.assignShapeTargets(idx);
    this.phase = 'forming';
    this.phaseStart = performance.now();
    this.setState({ activeIdx: idx });
  }

  startDissolving() {
    this.phase = 'dissolving';
    this.phaseStart = performance.now();
    this.particles.forEach(p => { p.dissolveVX = null; p.dissolveVY = null; });
  }

  clearTargets() {
    this.particles.forEach(p => {
      if (p.isFormable) {
        p.tx = null; p.ty = null;
        p.vx = (Math.random() - 0.5) * 0.6;
        p.vy = (Math.random() - 0.5) * 0.6;
      }
    });
  }

  jumpTo(idx) { this.startForming(idx); }

  ease(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

  tick(now) {
    this.rafId = requestAnimationFrame(this.tick);
    if (!this.lastTime) this.lastTime = now;
    const dt = Math.min(50, now - this.lastTime);
    this.lastTime = now;
    this.update(now, dt);
    this.draw(now);
  }

  update(now, dt) {
    const speed = this.props.animationSpeed ?? 3;
    const factor = speed / 3;
    const durations = {
      drift: 1200 / factor, forming: 2600 / factor,
      formed: 3200 / factor, dissolving: 1400 / factor
    };
    this.durations = durations;
    const elapsed = now - this.phaseStart;
    const autoCycle = this.props.autoCycle !== false;
    const mouseInteraction = this.props.mouseInteraction !== false;
    const w = this.dims.w, h = this.dims.h;

    if (this.currentShapeIdx == null) this.currentShapeIdx = 0;

    if (this.phase === 'drift') {
      if (autoCycle && elapsed >= durations.drift) {
        this.startForming((this.currentShapeIdx + 1) % this.shapes.length);
      }
    } else if (this.phase === 'forming') {
      if (elapsed >= durations.forming) { this.phase = 'formed'; this.phaseStart = now; }
    } else if (this.phase === 'formed') {
      if (elapsed >= durations.formed) { this.startDissolving(); }
    } else if (this.phase === 'dissolving') {
      if (elapsed >= durations.dissolving) { this.phase = 'drift'; this.phaseStart = now; this.clearTargets(); }
    }

    this.particles.forEach(p => {
      if (p.isFormable && p.tx != null && this.phase !== 'drift') {
        if (this.phase === 'forming') {
          const t = this.ease(Math.min(1, elapsed / durations.forming));
          p.x = p.formX + (p.tx - p.formX) * t;
          p.y = p.formY + (p.ty - p.formY) * t;
        } else if (this.phase === 'formed') {
          p.x = p.tx + Math.sin(now/600 + p.phaseOffset) * 1.2;
          p.y = p.ty + Math.cos(now/700 + p.phaseOffset) * 1.2;
        } else if (this.phase === 'dissolving') {
          if (p.dissolveVX == null) {
            const ang = Math.random() * Math.PI * 2, spd = 0.6 + Math.random()*0.8;
            p.dissolveVX = Math.cos(ang)*spd; p.dissolveVY = Math.sin(ang)*spd;
          }
          p.x += p.dissolveVX * dt * 0.06;
          p.y += p.dissolveVY * dt * 0.06;
          p.vx = p.dissolveVX * 0.3; p.vy = p.dissolveVY * 0.3;
        }
      } else {
        p.x += p.vx * dt * 0.05;
        p.y += p.vy * dt * 0.05;
        p.vx += (Math.random()-0.5)*0.02;
        p.vy += (Math.random()-0.5)*0.02;
        p.vx = Math.max(-0.6, Math.min(0.6, p.vx));
        p.vy = Math.max(-0.6, Math.min(0.6, p.vy));
        if (p.x < -10) p.x = w+10; if (p.x > w+10) p.x = -10;
        if (p.y < -10) p.y = h+10; if (p.y > h+10) p.y = -10;
      }

      if (mouseInteraction && this.mouse.active && (this.phase === 'drift' || !p.isFormable)) {
        const dx = this.mouse.x - p.x, dy = this.mouse.y - p.y, dist = Math.hypot(dx,dy);
        const R = 160;
        if (dist < R && dist > 0.01) {
          const pull = (1 - dist/R) * (1 - dist/R) * 0.045;
          p.vx += (dx/dist) * pull;
          p.vy += (dy/dist) * pull;
          p.vx *= 0.985; p.vy *= 0.985;
        }
      }
    });
  }

  draw(now) {
    const ctx = this.ctx, w = this.dims.w, h = this.dims.h;
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);
    const grad = ctx.createRadialGradient(w/2, h*0.42, 10, w/2, h*0.5, Math.max(w,h)*0.75);
    grad.addColorStop(0, '#2a2017');
    grad.addColorStop(1, '#141119');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    if (this.phase !== 'drift' && this.currentShapeIdx != null && this.durations) {
      const shape = this.shapes[this.currentShapeIdx];
      const img = shape && shape.el;
      if (img && img.complete && img.naturalWidth) {
        const { cx, cy, r } = this.getStageCircle();
        const elapsed = now - this.phaseStart;
        let alpha = 1;
        if (this.phase === 'forming') alpha = this.ease(Math.min(1, elapsed / this.durations.forming));
        else if (this.phase === 'dissolving') alpha = 1 - this.ease(Math.min(1, elapsed / this.durations.dissolving));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(img, cx - r, cy - r, r*2, r*2);
        ctx.restore();
      }
    }

    const particles = this.particles;
    ctx.lineWidth = 1;
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      const aActive = a.isFormable && a.tx != null && this.phase !== 'drift';
      if (aActive) continue;
      for (let j = i+1; j < particles.length; j++) {
        const b = particles[j];
        const bActive = b.isFormable && b.tx != null && this.phase !== 'drift';
        if (bActive) continue;
        const dx = a.x-b.x, dy = a.y-b.y, d = Math.hypot(dx,dy);
        if (d < 70) {
          const op = (1 - d/70) * 0.3;
          ctx.strokeStyle = `rgba(240,232,216,${op})`;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }

    if (this.phase !== 'drift') {
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = 'rgba(245,200,66,0.55)';
      ctx.shadowColor = 'rgba(245,200,66,0.8)';
      ctx.shadowBlur = this.phase === 'formed' ? (8 + 2*Math.sin(now/400)) : 4;
      ctx.beginPath();
      for (let i = 0; i < this.formableCount; i++) {
        const p = particles[i];
        if (p.breakBefore || i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    particles.forEach(p => {
      const active = p.isFormable && p.tx != null && this.phase !== 'drift';
      ctx.beginPath();
      if (active) {
        ctx.fillStyle = this.phase === 'formed' ? '#F5C842' : '#F0E8D8';
        ctx.shadowColor = 'rgba(245,200,66,0.9)';
        ctx.shadowBlur = this.phase === 'formed' ? 10 : 5;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      } else {
        const tw = 0.55 + 0.45 * Math.sin(now/1000 * p.twinkleSpeed + p.twinklePhase);
        ctx.fillStyle = `rgba(240,232,216,${(0.5 + tw*0.4).toFixed(2)})`;
        ctx.shadowColor = 'rgba(240,232,216,0.4)';
        ctx.shadowBlur = 1.5 + tw*1.5;
        ctx.arc(p.x, p.y, p.r * (0.85 + tw*0.3), 0, Math.PI*2);
      }
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  renderVals() {
    const activeIdx = this.state.activeIdx ?? 0;
    const shapeButtons = this.shapes.map((s, i) => ({
      label: s.name,
      variant: i === activeIdx ? 'primary' : 'amber',
      onClick: () => this.jumpTo(i)
    }));
    return { canvasRef: this.canvasRef, shapeButtons };
  }
}
</script>
</body>
</html>
